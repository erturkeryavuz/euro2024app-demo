<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161B"/>
      <stop offset="55%" stop-color="#101113"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="76%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#101113" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252B36"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="spScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131A28"/>
      <stop offset="100%" stop-color="#0D111A"/>
    </linearGradient>
    <linearGradient id="spBanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2C4A"/>
      <stop offset="100%" stop-color="#121F36"/>
    </linearGradient>
    <filter id="spShadow" x="-18%" y="-10%" width="136%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#spBg)"/>
  <rect width="1280" height="640" fill="url(#spGlow)"/>

  <!-- Left Title Block (high-contrast for 320x160 thumbnail legibility) -->
  <g>
    <text x="72" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="3.2" fill="#B49A78">SWIFTUI iOS · FIREBASE</text>

    <text x="72" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#F1EDE5" letter-spacing="-1.2">Euro 2024</text>
