    <text x="72" y="576" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" letter-spacing="1.4" fill="#8C96A3">ERTÜRK ERYAVUZ</text>
