    <text x="72" y="392" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="25" font-weight="400" fill="#D5D0C6">Match timelines, 20-team standings,</text>
    <text x="72" y="428" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="25" font-weight="400" fill="#D5D0C6">and a 220-player football directory.</text>

    <text x="72" y="494" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="17" font-weight="600" letter-spacing="0.6" fill="#8EA2A8">SwiftUI  ·  Firebase Auth  ·  Cloud Firestore</text>

